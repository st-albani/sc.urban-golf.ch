version: 2

# Security-Updates laufen unabhängig von dieser Datei (Repo-Setting "Dependabot security
# updates"). Hier geht es um die regulären Version-Updates, die bisher gefehlt haben.
updates:
  # npm-Workspaces werden über das Root-Lockfile aufgelöst — ein Eintrag deckt
  # frontend/, backend/ und packages/contract/ ab.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Majors eine Woche zurückhalten: ein Major erscheint meist bevor die Pakete,
    # die exakt darauf peeren, überhaupt nachgezogen haben — die Woche lässt die
    # Familie vollständig werden, bevor der PR aufgeht. Der eine Tag auf Minor/Patch
    # wartet nur den Floor ab, den pnpm >= 11 mit minimumReleaseAge (24 h) ohnehin
    # beim Install erzwingt. Alle drei Keys explizit: ein weggelassenes
    # default-days verhält sich beobachtet nicht wie dokumentiert.
    cooldown:
      semver-major-days: 7
      semver-minor-days: 1
      semver-patch-days: 1
    # Minor/Patch gebündelt, damit nicht jede Woche ein Dutzend Lockfile-PRs
    # gegeneinander konfligiert. Majors kommen einzeln — die wollen wir bewusst prüfen.
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Kontostandard: Patch und Minor getrennt, damit ein reiner Patch-PR auch
      # als "patch" gemeldet wird — das Auto-Merge-Gate in ci.yml hängt daran.
      # Stehen bewusst hinter den beiden Gruppen oben, die zuerst greifen.
      npm-patch:
        patterns: ['*']
        update-types: ['patch']
      npm-minor:
        patterns: ['*']
        update-types: ['minor']
      # Eigene Spuren für Advisories: applies-to steht per Default auf
      # version-updates, alle Gruppen oben sind für Security-Updates also taub und
      # jeder Alert käme als einzelner PR. Nach Update-Type getrennt aus demselben
      # Grund wie die Kataloge — damit ein reiner Patch-PR auch als "patch"
      # gemeldet wird und sich selbst mergen kann.
      npm-security-patch:
        applies-to: security-updates
        patterns: ['*']
        update-types: ['patch']
      npm-security-minor:
        applies-to: security-updates
        patterns: ['*']
        update-types: ['minor']

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-base-images:
        patterns:
          - "*"
    # Dependabot folgt beim node-Tag stumpf dem höchsten Major und kennt den
    # LTS-Status nicht — so kam #135 mit einem Sprung auf das damalige Non-LTS
    # node:26. Major-Wechsel machen wir bewusst: jeden Oktober, wenn der neue
    # LTS-Zweig aufgeht (Node 26 wird 10/2026 LTS). Patches innerhalb von
    # node:24-alpine kommen ohnehin über das floating Tag.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
